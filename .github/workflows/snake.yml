name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"     # corre todos los días a las 00:00 UTC
  workflow_dispatch:         # te deja correrlo a mano desde Actions

permissions:
  contents: write            # NECESARIO para poder pushear a la rama output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: RomanBossio
          outputs: dist/snake.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
