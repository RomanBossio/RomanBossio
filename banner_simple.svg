<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo cuadriculado muy sutil -->
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" rx="2" ry="2" fill="#161B22"/>
    </pattern>

    <!-- Gradiente para el texto (verde) -->
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AAD52"/>
      <stop offset="100%" stop-color="#00C16A"/>
    </linearGradient>

    <!-- Brillo que se mueve por encima -->
    <linearGradient id="g-shimmer" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
      <animate attributeName="x1" from="-200" to="1100" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0" to="1300" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .title { font: 900 64px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="250" fill="#0D1117"/>
  <rect width="900" height="250" fill="url(#grid)" opacity="0.9"/>
  <rect width="900" height="250" fill="url(#g-shimmer)"/>

  <!-- Contenido -->
  <g transform="translate(450,120)">
    <!-- Texto (sin trucos) -->
    <text class="title" x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="url(#g-green)">ROMÁN BOSSIO</text>
    <!-- Borde suave para glow -->
    <text class="title" x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          fill="none" stroke="#00C16A" stroke-opacity=".25" stroke-width="2">ROMÁN BOSSIO</text>

    <!-- Línea que late debajo -->
    <g transform="translate(0,48)">
      <rect x="-220" y="0" width="440" height="4" rx="2" fill="#163D2A"/>
      <rect x="-220" y="0" width="220" height="4" rx="2" fill="#3AAD52">
        <animate attributeName="width" values="140;440;140" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>

